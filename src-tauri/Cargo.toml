[package]
name = "wb-switch-rust"
version = "0.8.10"
description = "wb-switch 鈥斺€?WorkBuddy 璐﹀彿鍒囨崲宸ュ叿锛圧ust/Tauri 鐗堬級"
authors = ["apple"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wb_switch_rust_lib"
# 妗岄潰鐗堝彧闇€ rlib锛坕OS 鐢?staticlib锛夈€?
#
# 鍒绘剰鍘绘帀 cdylib锛氬畠鏄?Android 闇€瑕佺殑浜х墿绫诲瀷锛屼細璁?GNU 閾炬帴鍣ㄥ皾璇曞鍑?
# 鍏ㄩ儴绗﹀彿锛岃€?MinGW 鐨勫鍑哄簭鍙蜂笂闄愭槸 65535 鈥斺€?鍔犲叆渚濊禆鍚庡疄娴嬭揪鍒?161178锛?
# 鎶ャ€宔xport ordinal too large銆嶉摼鎺ュけ璐ャ€傛闈㈡瀯寤轰笉闇€瑕?cdylib銆?
# 鑻ュ皢鏉ヨ鍑?Android 鐗堬紝璇锋敼鐢?MSVC 宸ュ叿閾惧苟鎶?cdylib 鍔犲洖銆?
crate-type = ["staticlib", "rlib"]

[features]
# 榛樿鍚敤 custom-protocol锛氫笉寮€璇?feature 鐨?`cargo build --release` 浼氫骇鍑哄姞杞?
# devUrl http://localhost:1420 鐨勫紑鍙戞ā寮?exe锛寁ite 鏈繍琛屾椂绐楀彛鍗虫姤
# 鈥渓ocalhost 鎷掔粷杩炴帴鈥濄€俙tauri dev` 浼?--no-default-features 骞惰繃婊ゆ湰 feature锛?
# `tauri build` 鏄惧紡浼?tauri/custom-protocol锛屼袱鑰呭潎涓嶅彈褰卞搷銆?
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
wb-switch-core = { path = "../crates/wb-switch-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
# 鍗曞疄渚嬩繚鎶わ細澶氬紑浼氬苟鍙戝啓 accounts.json 骞堕噸澶嶅惎鍋滅綉鍏?
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2.7.2"

# 绯荤粺鑷惎锛堝紑鏈洪潤榛樺惎鍔級锛氫粎妗岄潰鐩爣鏀寔锛坢acOS / Windows / Linux锛夈€?
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"

# macOS Dock 鍥炬爣涓庛€岄殣钘忚€岄潪閫€鍑恒€嶈涓烘墍闇€鐨?AppKit 缁戝畾銆?
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString"] }
