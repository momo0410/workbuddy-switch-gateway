[package]
name = "wb-switch-core"
version = "0.8.10"
edition = "2021"
description = "wb-switch 核心逻辑（账号/切换/会话/签到/更新），不依赖 Tauri，可被桌面端与 HTTP server 复用"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
chrono = "0.4"
# 内嵌压缩后的 gateway.exe（单文件分发），运行时解压到缓存
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

# CodeBuddy CN IDE Safe Storage (state.vscdb secret inject)
# aes/cbc/pbkdf2/sha1 供 macOS（Keychain→PBKDF2-SHA1→AES-128-CBC）与
# Linux（secret-tool→AES-128-CBC）分支使用；Windows 分支只用 aes-gcm。
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
sha1 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# Win32_System_JobObjects / Win32_System_Threading / Win32_Security 供网关子进程的
# Job Object 孤儿防护使用（应用退出时连带终止 gateway.exe）。
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading"] }

[build-dependencies]
# 构建期压缩内嵌网关
flate2 = "1"
